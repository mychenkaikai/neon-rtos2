[package]
name = "neon-rtos2"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "examples/cortex-m3",
    "examples/tests/"
]

[dependencies]
paste = "1.0"

[features]
# 默认启用 spin（测试需要），但不启用 embedded-alloc
default = ["dep:spin"]
# 嵌入式目标 features
cortex_m3 = ["dep:cortex-m", "dep:cortex-m-rt", "embedded-alloc", "dep:spin", "dep:cortex-m-semihosting", "critical-section/restore-state-bool"]
riscv = ["dep:riscv-rt", "dep:riscv", "embedded-alloc", "critical-section/restore-state-usize", "dep:spin"]
embedded-alloc = ["dep:embedded-alloc"]
alloc = []

[dependencies.critical-section]
version = "1.2"

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
serial_test = "3.0"

[dependencies.cortex-m]
version = "0.7.7"
optional = true

[dependencies.cortex-m-rt]
version = "0.7.3"
optional = true


[dependencies.alloc-cortex-m]
version = "0.4.4"
optional = true

[dependencies.spin]
version = "0.9.8"
optional = true

[dependencies.cortex-m-semihosting]
version = "0.5.0"
optional = true

[dependencies.riscv-rt]
version = "0.12.2"
optional = true

[dependencies.riscv]
version = "0.11.1"
optional = true

[dependencies.embedded-alloc]
version = "0.5.1"
optional = true

[dependencies.rand]
version = "0.9.2"
optional = true


[build-dependencies]
cc = "1.0"


[profile.dev]
opt-level = 0
debug = true
panic = "abort"

[profile.release]
opt-level = 3
panic = "abort"

[profile.test]
opt-level = 0
debug = true
