# Tests 编译配置（基于 Cortex-M3）
# 设置默认编译目标和 QEMU runner

[build]
# 默认编译目标：Cortex-M3
target = "thumbv7m-none-eabi"

[target.thumbv7m-none-eabi]
# 使用 QEMU 作为 runner，支持 cargo run
# 注意：runner 必须是单行命令或使用数组格式
runner = "qemu-system-arm -cpu cortex-m3 -machine lm3s6965evb -nographic -semihosting-config enable=on,target=native -kernel"

# 链接器配置已在 build.rs 中设置，这里不需要重复
# rustflags = [
#   "-C", "link-arg=-Tlink.x",
# ]

[env]
# 设置 DEFMT_LOG 级别（如果使用 defmt）
# DEFMT_LOG = "debug"

